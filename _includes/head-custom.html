<style>
  :root { color-scheme: dark; }
  html { background: #0f0f10; }
  body { background-color: #0f0f10; color: #e6e6e6; }

  .site-header { background: #0f0f10; border-top-color: #262628; border-bottom-color: #262628; }
  .site-title, .site-title:visited { color: #f2f2f2; }
  .site-nav .page-link { color: #c2c2c2; }
  .site-footer { border-top-color: #262628; color: #8a8a8a; }
  .site-footer a { color: #8ab4ff; }

  a { color: #7fb0ff; }
  a:visited { color: #a48cff; }
  a:hover { color: #a9c9ff; }

  h1, h2, h3, h4, h5, h6,
  .post-title, .post-link, .page-heading, .post-list-heading { color: #f2f2f2; }

  .post-meta { color: #8a8a8a; }
  hr { border-color: #262628; }
  blockquote { color: #b6b6b6; border-left-color: #3a3a3c; }

  pre, code { background: #1a1a1c; border-color: #2a2a2c; color: #e0e0e0; }
  pre { border-radius: 6px; }

  table { color: #dedede; border-color: #2a2a2c; }
  table th { background: #171719; border-color: #2a2a2c; }
  table td { border-color: #2a2a2c; }

  .post-content img, .post-cover img { border-radius: 6px; }
  .svg-icon { fill: #8a8a8a; }

  /* 超长链接在窄屏上换行，别撑出屏幕 */
  .post-content p, .post-content li, .post-content blockquote {
    overflow-wrap: break-word;
  }
  .post-content a {
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .post-content pre { overflow-x: auto; }

  .comments { margin-top: 3rem; padding-top: 1.6rem; border-top: 1px solid #262628; }
  .comments-title { font-size: 1.05em; margin: 0 0 1.2rem; color: #f2f2f2; }
  .comment-item { padding: 1.1rem 0; border-bottom: 1px solid #202022; }
  .comment-head { display: flex; align-items: baseline; gap: .7rem; font-size: .8em; color: #7a7a7a; }
  .comment-name { color: #cfcfcf; font-weight: 600; letter-spacing: .01em; }
  .comment-time { font-variant-numeric: tabular-nums; }
  .comment-body { margin-top: .5rem; font-size: 1em; line-height: 1.95; color: #e4e4e4; white-space: pre-wrap; word-break: break-word; }
  .comment-quote-block {
    margin: .5rem 0 0; padding: .5rem .8rem; border-left: 2px solid #3a3a3c;
    color: #9a9a9a; font-size: .88em; line-height: 1.8; white-space: pre-wrap; word-break: break-word;
    background: #141416; border-radius: 0 4px 4px 0;
  }
  .comment-empty { color: #8a8a8a; font-size: .9em; margin: 0; line-height: 1.9; }
  .comment-strike { text-decoration: line-through; color: #6c6c6c; }

  .comment-form { margin-top: 1.8rem; display: flex; flex-direction: column; gap: .6rem; }
  .comment-form input, .comment-form textarea {
    width: 100%; box-sizing: border-box; padding: .6rem .75rem; font-size: .95em;
    background: #141416; color: #e6e6e6; border: 1px solid #2a2a2c; border-radius: 6px;
    font-family: inherit; line-height: 1.6;
  }
  .comment-form input:focus, .comment-form textarea:focus { outline: none; border-color: #4f8cff; }
  .comment-form textarea {
    resize: vertical;          /* 只能往下拉长 */
    min-height: 6rem;          /* 最小高度 */
    max-height: 22rem;         /* 最大高度，超过后内部滚动 */
    overflow-y: auto;
  }
  .comment-hint { margin: .2rem 0 0; font-size: .85em; color: #8a8a8a; line-height: 1.7; }
  .comment-hint strong { color: #c8c8c8; font-weight: 500; }
  .comment-actions { display: flex; align-items: center; gap: 1rem; }
  .comment-actions button {
    padding: .5rem 1.3rem; background: #2a2a2c; color: #e6e6e6;
    border: 1px solid #3a3a3c; border-radius: 6px; cursor: pointer; font-size: .95em;
  }
  .comment-actions button:hover:not(:disabled) { background: #343437; }
  .comment-actions button:disabled { opacity: .6; cursor: default; }
  .comment-status { font-size: .85em; color: #8a8a8a; }
  .comment-status.is-error { color: #ff8f8f; }
  .comment-status.is-ok { color: #7ddc9a; }
  .comment-status.is-plain { color: #ffffff; }

  .comment-admin { margin-top: 1.5rem; font-size: .8em; color: #6c6c6c; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .comment-admin > button, #comment-admin-box button {
    background: none; border: 1px solid #2a2a2c; color: #8a8a8a;
    border-radius: 4px; padding: .2rem .6rem; font-size: 1em; cursor: pointer;
  }
  .comment-admin > button:hover, #comment-admin-box button:hover { color: #d0d0d0; border-color: #3a3a3c; }
  #comment-admin-box { align-items: center; gap: .4rem; }
  #comment-admin-box input {
    padding: .22rem .5rem; font-size: 1em; background: #141416; color: #e6e6e6;
    border: 1px solid #2a2a2c; border-radius: 4px; width: 9rem;
  }
  .comment-del {
    background: none; border: none; color: #7a7a7a; cursor: pointer;
    font-size: .95em; padding: 0 0 0 .7rem;
  }
  .comment-del:hover { color: #ff8f8f; }

  .comment-quote {
    padding: .55rem .8rem; margin-bottom: .2rem; border-left: 2px solid #4f8cff;
    background: #141416; border-radius: 0 4px 4px 0; font-size: .85em; color: #a8a8a8;
    line-height: 1.75; word-break: break-word;
  }
  .comment-quote-text { display: block; white-space: pre-wrap; }
  .comment-quote-clear {
    margin-top: .35rem; background: none; border: none; padding: 0;
    color: #7a7a7a; font-size: .95em; cursor: pointer; text-decoration: underline;
  }
  .comment-quote-clear:hover { color: #cfcfcf; }

  .quote-pick {
    position: absolute; z-index: 10000; display: none;
    padding: .22rem .6rem; font-size: .78em; line-height: 1.4;
    background: #242427; color: #e6e6e6; border: 1px solid #3a3a3c;
    border-radius: 999px; cursor: pointer; box-shadow: 0 2px 10px rgba(0,0,0,.45);
  }
  .quote-pick:hover { background: #303034; }
</style>
