<style>
  :root { color-scheme: dark; }
  html { background: #0f0f10; }
  body { background-color: #0f0f10; color: #e6e6e6; }

  .site-header { background: #0f0f10; border-top-color: #262628; border-bottom-color: #262628; }
  .site-title, .site-title:visited { color: #f2f2f2; }
  .site-nav .page-link { color: #c2c2c2; }
  .site-footer { border-top-color: #262628; color: #8a8a8a; }
  .site-footer a { color: #8ab4ff; }

  a { color: #7fb0ff; }
  a:visited { color: #a48cff; }
  a:hover { color: #a9c9ff; }

  h1, h2, h3, h4, h5, h6,
  .post-title, .post-link, .page-heading, .post-list-heading { color: #f2f2f2; }

  .post-meta { color: #8a8a8a; }
  hr { border-color: #262628; }
  blockquote { color: #b6b6b6; border-left-color: #3a3a3c; }

  pre, code { background: #1a1a1c; border-color: #2a2a2c; color: #e0e0e0; }
  pre { border-radius: 6px; }

  table { color: #dedede; border-color: #2a2a2c; }
  table th { background: #171719; border-color: #2a2a2c; }
  table td { border-color: #2a2a2c; }

  .post-content img, .post-cover img { border-radius: 6px; }
  .svg-icon { fill: #8a8a8a; }

  .comments { margin-top: 3rem; padding-top: 1.6rem; border-top: 1px solid #262628; }
  .comments-title { font-size: 1.05em; margin: 0 0 1.2rem; color: #f2f2f2; }
  .comment-item { padding: .9rem 0; border-bottom: 1px solid #202022; }
  .comment-head { display: flex; justify-content: space-between; gap: 1rem; font-size: .85em; color: #8a8a8a; }
  .comment-name { color: #d6d6d6; font-weight: 500; }
  .comment-body { margin-top: .4rem; line-height: 1.85; white-space: pre-wrap; word-break: break-word; }
  .comment-empty { color: #8a8a8a; font-size: .9em; margin: 0; line-height: 1.9; }
  .comment-strike { text-decoration: line-through; color: #6c6c6c; }

  .comment-form { margin-top: 1.8rem; display: flex; flex-direction: column; gap: .6rem; }
  .comment-form input, .comment-form textarea {
    width: 100%; box-sizing: border-box; padding: .6rem .75rem; font-size: .95em;
    background: #141416; color: #e6e6e6; border: 1px solid #2a2a2c; border-radius: 6px;
    font-family: inherit; line-height: 1.6;
  }
  .comment-form input:focus, .comment-form textarea:focus { outline: none; border-color: #4f8cff; }
  .comment-hint { margin: .2rem 0 0; font-size: .85em; color: #8a8a8a; line-height: 1.7; }
  .comment-hint strong { color: #c8c8c8; font-weight: 500; }
  .comment-actions { display: flex; align-items: center; gap: 1rem; }
  .comment-actions button {
    padding: .5rem 1.3rem; background: #2a2a2c; color: #e6e6e6;
    border: 1px solid #3a3a3c; border-radius: 6px; cursor: pointer; font-size: .95em;
  }
  .comment-actions button:hover:not(:disabled) { background: #343437; }
  .comment-actions button:disabled { opacity: .6; cursor: default; }
  .comment-status { font-size: .85em; color: #8a8a8a; }
  .comment-status.is-error { color: #ff8f8f; }
  .comment-status.is-ok { color: #7ddc9a; }
</style>
