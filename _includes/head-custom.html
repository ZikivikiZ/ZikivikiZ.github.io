<style>
  :root { color-scheme: dark; }
  html { background: #0f0f10; }
  body { background-color: #0f0f10; color: #e6e6e6; }

  .site-header { background: #0f0f10; border-top-color: #262628; border-bottom-color: #262628; }
  .site-title, .site-title:visited { color: #f2f2f2; }
  .site-nav .page-link { color: #c2c2c2; }
  .site-footer { border-top-color: #262628; color: #8a8a8a; }
  .site-footer a { color: #8ab4ff; }

  a { color: #7fb0ff; }
  a:visited { color: #a48cff; }
  a:hover { color: #a9c9ff; }

  h1, h2, h3, h4, h5, h6,
  .post-title, .post-link, .page-heading, .post-list-heading { color: #f2f2f2; }

  .post-meta { color: #8a8a8a; }
  hr { border-color: #262628; }
  blockquote { color: #b6b6b6; border-left-color: #3a3a3c; }

  pre, code { background: #1a1a1c; border-color: #2a2a2c; color: #e0e0e0; }
  pre { border-radius: 6px; }

  table { color: #dedede; border-color: #2a2a2c; }
  table th { background: #171719; border-color: #2a2a2c; }
  table td { border-color: #2a2a2c; }

  .post-content img, .post-cover img { border-radius: 6px; }
  .svg-icon { fill: #8a8a8a; }

  /* 超长链接在窄屏上换行，别撑出屏幕 */
  .post-content p, .post-content li, .post-content blockquote {
    overflow-wrap: break-word;
  }
  .post-content a {
    overflow-wrap: anywhere;
    word-break: break-word;
  }
  .post-content pre { overflow-x: auto; }

  .comments { margin-top: 3rem; padding-top: 1.6rem; border-top: 1px solid #262628; }
  .comments-title { font-size: 1.05em; margin: 0 0 1.2rem; color: #f2f2f2; }
  .comment-item { padding: 1.2rem 0; border-bottom: 1px solid #202022; }
  .comment-head { display: flex; align-items: baseline; gap: .7rem; font-size: .8em; color: #7a7a7a; }
  .comment-name { color: #cfcfcf; font-weight: 600; letter-spacing: .01em; }
  .comment-time { font-variant-numeric: tabular-nums; }
  .comment-quote-block {
    margin: .55rem 0 .4rem; padding: .5rem .85rem; border-left: 2px solid #3a3a3c;
    color: #9a9a9a; font-size: .88em; line-height: 1.85; white-space: pre-wrap; word-break: break-word;
    background: #141416; border-radius: 0 4px 4px 0;
  }
  .comment-body {
    margin: .35rem 0 0; font-size: 1em; line-height: 1.95; color: #e4e4e4;
    white-space: pre-wrap; word-break: break-word;
  }
  .comment-body + .comment-quote-block { margin-top: 1rem; }
  .comment-empty { color: #8a8a8a; font-size: .9em; margin: 0; line-height: 1.9; }
  .comment-strike { text-decoration: line-through; color: #6c6c6c; }

  .comment-open-row { display: flex; align-items: center; gap: .8rem; margin: 1.6rem 0 0; }
  .comment-open {
    padding: .55rem 1.4rem; background: #242427; color: #e6e6e6;
    border: 1px solid #3a3a3c; border-radius: 6px; cursor: pointer; font-size: .95em;
  }
  .comment-open:hover { background: #303034; }
  .comment-open-hint { font-size: .8em; color: #6c6c6c; }

  .comment-draft-tip {
    display: flex; align-items: center; gap: .8rem; margin: 0 0 1rem;
    padding: .55rem .85rem; font-size: .82em; color: #9a9a9a;
    background: #151517; border: 1px solid #262628; border-radius: 6px;
  }
  .comment-draft-resume {
    margin-left: auto; background: none; border: none; padding: 0;
    color: #7fb0ff; cursor: pointer; font-size: 1em; text-decoration: underline;
  }

  .comment-admin { margin-top: 1.5rem; font-size: .8em; color: #6c6c6c; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
  .comment-admin > button, #comment-admin-box button {
    background: none; border: 1px solid #2a2a2c; color: #8a8a8a;
    border-radius: 4px; padding: .2rem .6rem; font-size: 1em; cursor: pointer;
  }
  .comment-admin > button:hover, #comment-admin-box button:hover { color: #d0d0d0; border-color: #3a3a3c; }
  #comment-admin-box { align-items: center; gap: .4rem; }
  #comment-admin-box input {
    padding: .22rem .5rem; font-size: 1em; background: #141416; color: #e6e6e6;
    border: 1px solid #2a2a2c; border-radius: 4px; width: 9rem;
  }
  .comment-del {
    background: none; border: none; color: #7a7a7a; cursor: pointer;
    font-size: .95em; padding: 0 0 0 .7rem;
  }
  .comment-del:hover { color: #ff8f8f; }

  /* 选中的「引用」按钮 */
  .quote-pick {
    position: absolute; z-index: 10000; display: none;
    padding: .38rem 1rem; font-size: .92em; line-height: 1.5; letter-spacing: .02em;
    background: #242427; color: #f0f0f0; border: 1px solid #4a4a4e;
    border-radius: 999px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,.55);
  }
  .quote-pick:hover { background: #34343a; border-color: #5a5a60; }

  /* 浮动评论框 */
  .cm-box {
    display: none; position: fixed; right: 1rem; bottom: 1rem; z-index: 9997;
    width: min(420px, calc(100vw - 2rem)); max-height: 78vh; overflow: auto;
    background: #131315; border: 1px solid #2f2f33; border-radius: 10px;
    box-shadow: 0 18px 48px rgba(0,0,0,.6); padding: .9rem 1rem 1rem;
  }
  .cm-head { display: flex; align-items: center; margin-bottom: .7rem; }
  .cm-title { font-size: .95em; color: #f2f2f2; font-weight: 600; }
  .cm-head {
    position: sticky; top: -.9rem; margin: -.9rem -1rem .7rem; padding: .7rem 1rem .6rem;
    background: #131315; border-bottom: 1px solid #262628; z-index: 3;
  }
  .cm-close {
    margin-left: auto; display: flex; align-items: center; justify-content: center;
    width: 2.1rem; height: 2.1rem; border-radius: 50%;
    background: #232327; border: 1px solid #3a3a3e; color: #e9e9e9;
    font-size: 1.25em; line-height: 1; cursor: pointer; padding: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  .cm-close:hover { background: #34343a; border-color: #55555c; color: #fff; }
  .cm-blocks { display: flex; flex-direction: column; gap: .8rem; }
  .cm-block {
    border: 1px solid #262628; border-radius: 8px; padding: .6rem .7rem;
    background: #121214;
  }
  .cm-block-head { display: flex; align-items: center; margin-bottom: .45rem; }
  .cm-block-no { font-size: .75em; color: #6c6c6c; }
  .cm-block-del {
    margin-left: auto; background: none; border: none; color: #6c6c6c;
    font-size: .78em; cursor: pointer; padding: 0;
  }
  .cm-block-del:hover { color: #ff8f8f; }
  .cm-block-quote {
    margin: 0 0 .5rem; padding: .4rem .6rem; border-left: 2px solid #3a3a3c;
    background: #17171a; border-radius: 0 4px 4px 0;
    color: #9a9a9a; font-size: .82em; line-height: 1.7;
    white-space: pre-wrap; word-break: break-word; max-height: 7em; overflow: auto;
  }
  .cm-block-text {
    width: 100%; box-sizing: border-box; padding: .5rem .6rem; font-size: .92em;
    background: #17171a; color: #e6e6e6; border: 1px solid #2a2a2c; border-radius: 6px;
    font-family: inherit; line-height: 1.7; resize: vertical;
    min-height: 4.5rem; max-height: 14rem;
  }
  .cm-block-text:focus { outline: none; border-color: #4f8cff; }
  .cm-add-row { margin-top: .7rem; }
  .cm-add {
    background: none; border: 1px dashed #333; color: #8a8a8a;
    border-radius: 6px; padding: .35rem .8rem; font-size: .82em; cursor: pointer;
    width: 100%;
  }
  .cm-add:hover { color: #cfcfcf; border-color: #4a4a4a; }
  .cm-hint { margin: .8rem 0 0; font-size: .76em; color: #7a7a7a; line-height: 1.6; }
  .cm-hint strong { color: #c8c8c8; font-weight: 500; }
  .cm-foot { display: flex; gap: .45rem; margin-top: .7rem; }
  .cm-name, .cm-answer {
    flex: 1 1 0; min-width: 0; padding: .45rem .55rem; font-size: .85em;
    background: #17171a; color: #e6e6e6; border: 1px solid #2a2a2c; border-radius: 6px;
    font-family: inherit;
  }
  .cm-name { flex: 0 0 6.5rem; }
  .cm-name:focus, .cm-answer:focus { outline: none; border-color: #4f8cff; }
  .cm-submit {
    flex: none; padding: .45rem 1rem; font-size: .85em;
    background: #2a2a2c; color: #e6e6e6; border: 1px solid #3a3a3c;
    border-radius: 6px; cursor: pointer;
  }
  .cm-submit:hover:not(:disabled) { background: #343437; }
  .cm-submit:disabled { opacity: .6; cursor: default; }
  .cm-status { display: block; margin-top: .5rem; font-size: .78em; color: #8a8a8a; min-height: 1em; }
  .cm-status.is-error { color: #ff8f8f; }

  @media (max-width: 560px) {
    .cm-box {
      right: .7rem; left: auto; bottom: .7rem;
      width: min(92vw, 360px); height: auto; max-height: 58vh;
    }
  }
  /* 手机：选中文字后出现的底部引用条 */
  .cm-quote-bar {
    display: none; position: fixed; left: .6rem; right: .6rem; bottom: .8rem;
    z-index: 9996; align-items: center; gap: .8rem;
    padding: .6rem .85rem; background: #1b1b1e; border: 1px solid #3a3a3c;
    border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6);
  }
  .cm-quote-bar-label { flex: 1; font-size: .82em; color: #a8a8a8; }
  .cm-quote-bar-btn {
    padding: .45rem 1.1rem; background: #2a2a2c; color: #f0f0f0;
    border: 1px solid #4a4a4e; border-radius: 6px; font-size: .85em; cursor: pointer;
  }
  /* 正文里的「小图」：保持竖排，但别占满整行 */
  .post-content img.post-image-sm {
    display: block; width: 62%; max-width: 360px; height: auto;
    margin: 1.5rem auto;
  }
  @media (max-width: 560px) {
    .post-content img.post-image-sm { width: 84%; max-width: none; }
  }
  /* 引用内容被改掉之后的标记 */
  .comment-quote-block.is-link { cursor: pointer; transition: background .15s ease, border-color .15s ease; }
  .comment-quote-block.is-link:hover { background: #1a1a1e; border-left-color: #4f8cff; }
  .comment-quote-block.is-gone { border-left-color: #3a3a3c; }
  .comment-quote-badge {
    display: inline-block; margin-left: .55rem; padding: 0 .4rem;
    font-size: .85em; line-height: 1.7; color: #8a8a8a;
    border: 1px solid #333336; border-radius: 4px; background: #17171a;
  }

  /* 底部「写评论」展开的就地评论框 */
  .cm-box.cm-inline {
    position: static; width: 100%; max-height: none;
    margin: 1rem 0 0; padding: .9rem 1rem 1rem;
    box-shadow: none; border-radius: 8px;
  }
  .cm-box.cm-inline .cm-head { position: static; margin: -.9rem -1rem .7rem; }
  /* 从评论跳到原文后的「返回」按钮 */
  .quote-back {
    display: none; position: fixed; left: .6rem; top: 42%; z-index: 9995;
    padding: .35rem .7rem; font-size: .78em; white-space: nowrap;
    background: #1b1b1e; color: #cfcfcf; border: 1px solid #3a3a3e;
    border-radius: 999px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.5);
    opacity: .9;
  }
  .quote-back:hover { background: #2a2a30; color: #fff; opacity: 1; }
  @media (max-width: 560px) {
    .quote-back { top: auto; bottom: 5.2rem; left: .6rem; }
  }

  ::highlight(quote-hit) { background-color: rgba(255, 214, 102, .32); color: inherit; }
  /* 原文被改过时，用段落定位的高亮 */
  .quote-para-hit {
    animation: quoteFlash 2.4s ease;
    border-radius: 4px;
  }
  @keyframes quoteFlash {
    0%   { background: rgba(255, 214, 102, .38); }
    70%  { background: rgba(255, 214, 102, .18); }
    100% { background: transparent; }
  }</style>
