title: ZikivikiZ
description: 随笔与折腾记录
author: ZikivikiZ
theme: minima
lang: zh-CN
timezone: Asia/Shanghai

# 根站点（仓库名为 ZikivikiZ.github.io）时 baseurl 留空；
# 若是项目仓库（如 notes），改成 "/notes"
baseurl: ""
url: "https://zikivikiz.github.io"

show_excerpts: true
minima:
  date_format: "%Y-%m-%d"

# 评论接口（Cloudflare Worker）
comments_endpoint: "https://dsh-comments.1007435278.workers.dev"

# 静态资源版本号：改了 assets/ 下的 js 就把它 +1，浏览器才会重新下载
assets_version: 5

# 按纯文本习惯写：单个回车就换行，段落之间空一行。
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: true

# 文章地址：/2026/11/22/标题/
# 默认规则会把分类塞进地址里（/随笔/2026/...），中文会被转义成一长串 %E9%9A%8F...
permalink: /:year/:month/:day/:title/

header_pages:
  - essays.md
  - notes.md
  - about.md
  - search.md

plugins:
  - jekyll-feed
  - jekyll-seo-tag
